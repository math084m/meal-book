services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mealbook
      POSTGRES_USER: mealbook
      POSTGRES_PASSWORD: mealbook-local
    ports:
      - "5432:5432"
    volumes:
      - mealbook-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealbook -d mealbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__MealBook: Host=database;Port=5432;Database=mealbook;Username=mealbook;Password=mealbook-local
      Admin__Email: ${MEALBOOK_ADMIN_EMAIL:-}
      Admin__Password: ${MEALBOOK_ADMIN_PASSWORD:-}
    ports:
      - "5080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend/meal-book
      dockerfile: Dockerfile
      args:
        APP_BASE_HREF: /
    ports:
      - "8080:8080"
    depends_on:
      - backend
    volumes:
      - ./docker-compose.nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mealbook-postgres:
