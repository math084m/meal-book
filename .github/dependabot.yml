version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/backend
    schedule:
      interval: weekly
    groups:
      aspnetcore:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.Extensions.*", "Npgsql*"]
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
  - package-ecosystem: npm
    directory: /src/frontend/meal-book
    schedule:
      interval: weekly
    groups:
      # Angular packages must move in lockstep; majors also need `ng update` migrations.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "typescript", "zone.js"]
      test:
        patterns: ["karma*", "jasmine*", "@types/jasmine", "istanbul*"]
    ignore:
      - dependency-name: jasmine-core
        versions: [">=6"]
      - dependency-name: "@types/jasmine"
        versions: [">=6"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        versions: ["25", "27", "29"]
  - package-ecosystem: docker
    directory: /src/backend
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /src/frontend/meal-book
    schedule:
      interval: monthly
    ignore:
      # Stay on even-numbered (LTS) Node releases.
      - dependency-name: node
        versions: ["25", "27", "29"]